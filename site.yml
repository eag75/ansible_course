---
- hosts: all
  become: true
  pre_tasks:

  - name: install updates for fedora
    tags: allways
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_only: yes
      update_cache: yes
    when: ansible_facts["os_family"] == "RedHat"

  - name: install updates for Ubuntu
    tags: always
    ansible.builtin.apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts["os_family"] == "Debian"

- hosts: web_servers
  become: true
  tasks:

  - name: install apache on web servers (ubuntu)
    tags: apache,ubuntu
    ansible.builtin.apt:
      name:
      - apache2
      - libapache2-mod-php
    when: ansible_facts["os_family"] == "Debian"

  - name: install apache on web servers (fedora)
    tags: apache,fedora
    ansible.builtin.dnf:
      name: httpd
    when: ansible_facts["os_family"] == "RedHat"

  - name: ensure apache is running (ubuntu)
    tags: apache,ubuntu
    ansible.builtin.service:
      name: apache2
      state: started
    when: ansible_facts["os_family"] == "Debian"

  - name: ensure apache is running (fedora)
    tags: apache,fedora
    ansible.builtin.service:
      name: httpd
      state: started
    when: ansible_facts["os_family"] == "RedHat"

  - name: change email address for admin
    tags: apache,fedora
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: '^ServerAdmin'
      line: ServerAdmin somebody@somewhere.net
    when: ansible_facts["os_family"] == "RedHat"
    register: httpd

  - name: restart httpd (fedora)
    tags: apache,fedora
    ansible.builtin.service:
      name: httpd
      state: restarted
    when: httpd.changed

  - name: copy html file for site
    tags: apache,ubuntu
    ansible.builtin.copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

- hosts: db_servers
  tags: db,fedora
  become: true
  tasks:

  - name: install mariadb package on db servers
    ansible.builtin.dnf:
      name : mariadb
      state: latest
    when: ansible_facts["os_family"] == "RedHat"

    
