---
- hosts: all
  become: true
  pre_tasks:

  - name: install updates for fedora
    tags: allways
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_only: yes
      update_cache: yes
    when: ansible_facts["os_family"] == "RedHat"

  - name: install updates for Ubuntu
    tags: always
    ansible.builtin.apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts["os_family"] == "Debian"

- hosts: web_servers
  become: true
  tasks:

  - name: install apache on web servers
    tags: apache,ubuntu
    ansible.builtin.apt:
      name:
      - apache2
      - libapache2-mod-php
    when: ansible_facts["os_family"] == "Debian"

- hosts: db_servers
  tags: db,fedora
  become: true
  tasks:

  - name: install mariadb package on db servers
    ansible.builtin.dnf:
      name : mariadb
      state: latest
    when: ansible_facts["os_family"] == "RedHat"

    
