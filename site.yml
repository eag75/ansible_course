---
- hosts: all
  become: true
  pre_tasks:

  - name: install updates for fedora
    tags: allways
    ansible.builtin.dnf:
      name: "*"
      state: latest
      update_only: yes
      update_cache: yes
    when: ansible_facts["os_family"] == "RedHat"

  - name: install updates for Ubuntu
    tags: always
    ansible.builtin.apt:
      upgrade: dist
      update_cache: yes
    when: ansible_facts["os_family"] == "Debian"

- hosts: all
  become: true
  roles:
    - base

- hosts: db_servers
  become: true
  roles:
    - db_servers

- hosts: web_servers
  become: true
  roles:
    - web_servers